name: Postponement Email Blast

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run? true = list recipients only, no emails sent'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      test_email:
        description: 'Send to ONE address only (leave blank for full blast)'
        required: false
        default: ''
      wave:
        description: 'paid = paid+deposit members only | all = everyone (dedup skips already-sent)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'paid'

jobs:
  blast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send postponement emails
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          WAVE: ${{ github.event.inputs.wave }}
        run: node scripts/send-postponement-blast.mjs
