name: Postponement Email Blast

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run? true = list recipients only, no emails sent'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      test_email:
        description: 'Send to ONE address only (leave blank for full blast)'
        required: false
        default: ''

jobs:
  blast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send postponement emails
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SMTP_DELAY_MS: '300'
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: node scripts/send-postponement-blast.mjs
